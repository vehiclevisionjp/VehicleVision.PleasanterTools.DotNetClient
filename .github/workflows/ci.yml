name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
      - name: ロック済み依存を復元する
        run: dotnet restore --locked-mode
      - name: ビルドする
        run: dotnet build --no-restore -c Release
      - name: テストする
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      # api-surface/history.json から生成したクライアントのコードが、コミットされたものと一致するか（_documents/クライアントの生成と版の判定.md）
      - name: 生成物が最新かを確かめる
        run: dotnet run --project tools/VehicleVision.PleasanterTools.DotNetClient.Generator --no-build -c Release -- check
      # 配布できる形（NuGet パッケージ）になっているかを、公開しなくても確かめる
      - name: パッケージを作る
        run: dotnet pack --no-build -c Release -o artifacts
      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: テスト結果
          path: TestResults/*.trx
          if-no-files-found: warn
  instructions:
    name: instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - run: bash scripts/sync-agents.sh --check
      - run: bash scripts/test-sync-reference.sh
      - run: bash scripts/reference-isolation-check.sh
